server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache fingerprinted assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA client-side routing: everything falls back to index.html.
  # (/trpc and /ingest are routed to the backend by the Ingress, not nginx.)
  location / {
    try_files $uri /index.html;
  }
}
