name: kubepilot

# Local development infrastructure for Phase 0.
#   - Postgres + TimescaleDB (single instance: relational + usage time-series)
#   - Two Redis instances: durable queue (AOF) and cache/sessions (per architecture)
#   - MinIO (S3-compatible object storage) for reports, with an auto-created bucket
# Cloud provisioning (Terraform/Pulumi) is deferred to a later phase.

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: kubepilot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kubepilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kubepilot}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-queue:
    image: redis:7-alpine
    container_name: kubepilot-redis-queue
    # Durable: append-only file on, so at-least-once ingestion survives restarts.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-cache:
    image: redis:7-alpine
    container_name: kubepilot-redis-cache
    # Ephemeral cache/sessions: no persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: kubepilot-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # One-shot job: waits for MinIO, then creates the reports bucket. Exits 0.
  minio-init:
    image: minio/mc:latest
    container_name: kubepilot-minio-init
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "${S3_ACCESS_KEY:-minioadmin}" "${S3_SECRET_KEY:-minioadmin}"; do
          echo "waiting for minio..."; sleep 2;
        done;
        mc mb -p "local/${S3_BUCKET:-kubepilot-reports}" || true;
        echo "bucket ready: ${S3_BUCKET:-kubepilot-reports}";
        exit 0;

volumes:
  pgdata:
  redis_queue_data:
  minio_data:
