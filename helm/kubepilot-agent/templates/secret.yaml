# The agent token lives in a Secret (never a plain env value in the manifest).
# `required` makes `helm install` fail fast if --set token=... is missing.
apiVersion: v1
kind: Secret
metadata:
  name: kubepilot-agent-token
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  token: {{ required "token is required — pass --set token=kp_..." .Values.token | quote }}
