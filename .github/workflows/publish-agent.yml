name: Publish Agent

# Publishes the customer-facing agent (image + Helm chart) to GHCR so the
# dashboard's `helm install` one-liner works for real users.
# Trigger: push a version tag (v0.1.0) OR run manually with a version input.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0)"
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # QEMU lets the amd64 runner cross-build the arm64 image.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-helm@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          push: true
          # Multi-arch so the published image runs on Intel/AMD AND ARM clusters
          # (Apple Silicon kind, AWS Graviton, Ampere, Raspberry Pi, etc.).
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/agent:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package & push the Helm chart (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          helm package helm/kubepilot-agent \
            --version "${{ steps.v.outputs.version }}" \
            --app-version "${{ steps.v.outputs.version }}"
          helm push "kubepilot-agent-${{ steps.v.outputs.version }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"
