name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kubepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kubepilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kubepilot?schema=public
      APP_DATABASE_URL: postgresql://kubepilot_app:app_password@localhost:5432/kubepilot?schema=public

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json (single source of truth)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Bootstrap .env (dotenv-cli target; job-level env below takes precedence)
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations (tables + extensions + RLS + app role)
        run: pnpm db:migrate

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Seed demo tenants
        run: pnpm db:seed

      - name: Verify tenant isolation (RLS)
        run: pnpm db:verify-rls
