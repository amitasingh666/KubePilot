# KubePilot — single-VM prototype deploy.
# Everything (apps + Postgres/Timescale + Redis ×2 + MinIO + Caddy TLS) on one box.
#
#   cp deploy/.env.prod.example deploy/.env   # then edit it
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Caddy terminates HTTPS for $DOMAIN and routes /trpc + /ingest → backend, / → web.
name: kubepilot

services:
  # ── Data stores ──
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kubepilot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kubepilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"] # AOF persistence for the job queue
    volumes: [redis_queue_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 5s, retries: 20 }

  minio-init:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_started } }
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb -p local/kubepilot-reports || true;
      "
    restart: "no"

  # ── Migrations (run once, before the apps) ──
  migrate:
    build: { context: .., dockerfile: apps/backend/Dockerfile }
    image: kubepilot/backend:latest
    working_dir: /repo/packages/db
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/kubepilot?schema=public
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  # ── Application services ──
  backend:
    build: { context: .., dockerfile: apps/backend/Dockerfile }
    image: kubepilot/backend:latest
    restart: unless-stopped
    environment: &app_env
      NODE_ENV: production
      APP_DATABASE_URL: postgresql://kubepilot_app:app_password@postgres:5432/kubepilot?schema=public
      REDIS_QUEUE_URL: redis://redis-queue:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
      SESSION_SECRET: ${SESSION_SECRET}
      WEB_ORIGIN: https://${DOMAIN}
      INGESTION_URL: https://${DOMAIN}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: kubepilot-reports
      S3_REGION: us-east-1
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: "${EMAIL_FROM:-KubePilot <onboarding@resend.dev>}"
    depends_on:
      postgres: { condition: service_healthy }
      redis-queue: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  ingestion:
    image: kubepilot/worker:latest
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    environment: *app_env
    depends_on:
      redis-queue: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  engine:
    image: kubepilot/worker:latest
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    command: ["node", "dist/engine.js"]
    environment: *app_env
    depends_on:
      redis-queue: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: .., dockerfile: apps/frontend/Dockerfile }
    image: kubepilot/frontend:latest
    restart: unless-stopped

  # ── Reverse proxy + automatic HTTPS ──
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, web]

volumes:
  pgdata:
  redis_queue_data:
  minio_data:
  caddy_data:
  caddy_config:
